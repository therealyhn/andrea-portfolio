name: Objava na hosting

# Sadržaj dolazi iz Maestro CMS instance klijenta u trenutku izrade. Instanca pokreće ovaj workflow
# posle objave (workflow_dispatch, plan.md §3.19 u maestro-cms), ručno pokretanje služi za ponovnu
# objavu bez izmene, a `push` na main objavljuje izmenu koda (od prelaska u produkciji 17.11.2026,
# kartica MS.12b u maestro-cms).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deljeni hosting nema atomsku zamenu izdanja: dve objave u isto vreme bi pomešale
# fajlove, pa se objave redaju umesto da se prekidaju.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Folder u koji FTP nalog upisuje sajt. Nema podrazumevane vrednosti: pogrešan
  # folder se upload-uje bez greške, a sajt ostaje star.
  DEPLOY_ROOT: ${{ vars.FTP_SERVER_DIR }}
  # Javni API CMS instance klijenta: https://cms.andreamilenovic.com/dashboard/api/v1.
  CMS_API_URL: ${{ vars.CMS_API_URL }}
  SITE_URL: https://andreamilenovic.com/

jobs:
  deploy:
    name: Izrada i objava
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provera podešavanja
        # Pada za nekoliko sekundi sa čitljivom porukom, pre izrade.
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name nije postavljen."
              exit 1
            fi
          done
          case "$CMS_API_URL" in
            https://*) ;;
            *) echo "::error::Varijabla CMS_API_URL mora postojati i početi sa https:// (javni API CMS instance klijenta)."; exit 1 ;;
          esac
          case "$DEPLOY_ROOT" in
            */) ;;
            *) echo "::error::Varijabla FTP_SERVER_DIR mora postojati i završiti se sa / (npr. / ili /public_html/)."; exit 1 ;;
          esac
          case "$FTP_SERVER" in
            *://*|*/*|*:*|*\ *) echo "::error::FTP_SERVER mora biti samo ime servera ili IP, bez ftp://, putanje, porta i razmaka."; exit 1 ;;
          esac
          if getent hosts "$FTP_SERVER" > /dev/null; then
            echo "FTP server se razrešava, dužina imena ${#FTP_SERVER} znakova."
          else
            echo "::error::FTP_SERVER se ne razrešava (dužina ${#FTP_SERVER} znakova; višak obično znači razmak ili novi red)."
            exit 1
          fi

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalacija
        run: npm ci

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: PHPMailer
        # Endpoint forme (public/api/contact.php) šalje kroz PHPMailer iz server/vendor; vendor nije u gitu.
        # Objava pada na poznat sigurnosni propust u zaključanoj verziji.
        run: |
          composer validate --strict --working-dir=server
          composer audit --locked --working-dir=server
          composer install --no-dev --classmap-authoritative --no-interaction --no-progress --working-dir=server

      - name: Lint
        run: npm run lint

      - name: Chrome za prerender
        # Ubuntu 24.04 kroz AppArmor zabranjuje neprivilegovane korisničke prostore imena, pa Chrome
        # iz Puppeteer-a ne može da podigne svoj sandbox; prerender otvara samo sopstvenu izradu.
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns > /dev/null
          fi

      - name: Izrada (sadržaj iz CMS-a, Vite, prerender)
        run: npm run build

      - name: Endpoint forme
        # Vite kopira public/api u dist/api; vendor ide pored njega, a api/.htaccess ga zatvara za posetioce.
        # get_oauth_token.php je primer stranica iz PHPMailer paketa; endpoint je ne koristi, pa ne ide na server.
        run: |
          cp -R server/vendor dist/api/vendor
          rm -f dist/api/vendor/phpmailer/phpmailer/get_oauth_token.php
          php -l dist/api/contact.php
          php -l dist/api/lib/kontakt.php

      - name: Provera izlaza
        run: |
          fail=0
          for file in .htaccess index.html 404.html robots.txt sitemap.xml llms.txt api/contact.php api/lib/kontakt.php api/.htaccess api/vendor/autoload.php; do
            test -f "dist/$file" || { echo "::error::dist/$file ne postoji."; fail=1; }
          done
          if [ -e dist/api/config.php ] || find dist -name 'kontakt-config.php' | grep -q .; then
            echo "::error::dist sadrži config forme; config živi samo iznad public_html na serveru."
            fail=1
          fi
          if ! grep -q 'data-prerendered' dist/index.html; then
            echo "::error::dist/index.html nema prerenderovan sadržaj."
            fail=1
          fi
          if find dist -name '*.map' | grep -q .; then
            echo "::error::dist sadrži source map fajlove."
            fail=1
          fi
          echo "Poglavlja u prerenderovanoj strani: $(grep -o '<article id="ch-' dist/index.html | wc -l)"
          exit $fail

      - name: Upload na hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ env.DEPLOY_ROOT }}
          state-name: .ftp-deploy-state.json
          dangerous-clean-slate: false

      - name: Provera objavljenog sajta
        # Upload u pogrešan folder prolazi bez greške, zato se poredi paket na sajtu sa ovom
        # izradom; query string zaobilazi keš.
        run: |
          expected="$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)"
          if [ -z "$expected" ]; then
            echo "::error::U dist/index.html nema imena JS paketa."
            exit 1
          fi
          echo "Ova izrada: $expected"
          for attempt in 1 2 3 4 5; do
            live="$(curl -fsS --max-time 20 "${SITE_URL}?deploy-check=${GITHUB_RUN_ID}-${attempt}" || true)"
            if printf '%s' "$live" | grep -q "$expected"; then
              echo "Sajt služi $expected"
              exit 0
            fi
            echo "Pokušaj $attempt: sajt još ne služi $expected."
            sleep 10
          done
          echo "::error::Sajt služi stariji ili drugi sadržaj. Proveri FTP_SERVER_DIR i da DNS andreamilenovic.com pokazuje na ovaj hosting."
          exit 1

      - name: Provera forme na sajtu
        # Prazan POST mora da stigne do provere polja (422): tada su config iznad public_html, vendor i
        # dozvoljen Origin na mestu, a mejl se ne šalje. vendor i lib moraju vratiti 403. Hostinger CDN
        # ume da vrati goli 307 ili da prekine vezu (000), pa se samo tada zahtev ponavlja.
        run: |
          origin="${SITE_URL%/}"
          body_file="$RUNNER_TEMP/forma-odgovor"
          probe() {
            local path="$1"
            shift
            local attempt
            for attempt in 1 2 3 4 5; do
              code="$(curl -sS -o "$body_file" -w '%{http_code}' --max-time 20 "$@" "${SITE_URL}${path}?deploy-check=${GITHUB_RUN_ID}-${attempt}" || true)"
              case "$code" in
                307|000) echo "Pokušaj $attempt za $path: HTTP $code, ponavljam za 5 s."; sleep 5 ;;
                *) return 0 ;;
              esac
            done
          }
          fail=0
          probe api/contact.php -X POST -H "Origin: $origin" -H 'Content-Type: application/json' --data '{}'
          if [ "$code" = 422 ] && grep -q '"success":false' "$body_file"; then
            echo "api/contact.php: 422 na prazan POST."
          else
            echo "::error::api/contact.php na prazan POST vraća HTTP $code umesto 422 (kontakt-config.php iznad public_html, api/vendor ili Origin)."
            fail=1
          fi
          for path in api/vendor/autoload.php api/lib/kontakt.php; do
            probe "$path"
            if [ "$code" = 403 ]; then
              echo "$path: 403."
            else
              echo "::error::$path vraća HTTP $code umesto 403 (api/.htaccess)."
              fail=1
            fi
          done
          exit $fail
